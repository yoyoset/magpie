name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows only: the shell is Windows-first (toasts, Credential Manager, WebView2).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The Tauri app embeds ui/dist at compile time; build it before any cargo step.
      - name: UI (typecheck + build)
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        # Tests marked #[ignore] touch the real credential store; they stay local.
        run: cargo test --workspace
