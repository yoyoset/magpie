[package]
name = "magpie-app"
description = "Magpie desktop shell: tray, toasts, and the wiring of API server + runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "magpie-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono.workspace = true
magpie-channels.workspace = true
magpie-config.workspace = true
magpie-core.workspace = true
magpie-runtime.workspace = true
magpie-server.workspace = true
magpie-store.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
